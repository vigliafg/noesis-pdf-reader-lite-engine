name: build-releases

# Multi-platform release, on the same pattern as the desktop repos:
#   Windows  → .exe + NSIS installer
#   macOS    → .dmg (x86_64 + arm64)
#   Linux    → AppImage (x86_64)
# Triggered by a v* tag (e.g. v0.30.0) or manually from Actions.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-tui.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Console tool: NO --windowed. The .exe/.bin opens in the terminal.
          ICON=""
          case "$RUNNER_OS" in
            Windows) [ -f assets/noesis-pdf-reader-lite-engine.ico ] && ICON="--icon assets/noesis-pdf-reader-lite-engine.ico" ;;
            macOS)   [ -f assets/noesis-pdf-reader-lite-engine.icns ] && ICON="--icon assets/noesis-pdf-reader-lite-engine.icns" ;;
          esac
          pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-pdf-reader-lite-engine \
            $ICON \
            --collect-all textual \
            --collect-all pymupdf --collect-all pymupdf4llm \
            cli.py \
          || pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-pdf-reader-lite-engine \
            $ICON \
            cli.py

      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # choco può fallire in modo transitorio: retry + ricerca esplicita
          # di makensis (x86 e x64) prima di dichiarare errore.
          choco install nsis -y --no-progress || choco upgrade nsis -y --no-progress || true
          NSIS="$(command -v makensis || true)"
          if [ -z "$NSIS" ]; then
            for candidate in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/Program Files/NSIS/makensis.exe"; do
              if [ -x "$candidate" ]; then NSIS="$candidate"; break; fi
            done
          fi
          if [ -z "$NSIS" ]; then
            echo "makensis non trovato dopo l'installazione" >&2
            ls -la "/c/Program Files" "/c/Program Files (x86)" || true
            exit 1
          fi
          "$NSIS" -VERSION
          V="${GITHUB_REF#refs/tags/v}"
          [[ "$V" == "$GITHUB_REF" ]] && V="0.0.0-dev"
          export PATH="$(dirname "$NSIS"):$PATH"
          MSYS_NO_PATHCONV=1 "$NSIS" "/DVERSION=$V" installer.nsi
          ls -la *.exe

      - name: Package artifact
        shell: bash
        env:
          BASE: noesis-pdf-reader-lite-engine-${{ matrix.name }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              mv "dist/noesis-pdf-reader-lite-engine.exe" "$BASE.exe"
              SETUP=$(echo noesis-pdf-reader-lite-engine-*-setup.exe)
              if [ -f "$SETUP" ]; then
                mv "$SETUP" "$BASE-setup.exe"
              fi
              ;;
            macOS)
              # Standalone console binary wrapped in a .dmg (desktop style).
              mkdir -p dmg
              cp "dist/noesis-pdf-reader-lite-engine" dmg/
              cp README.md LICENSE* dmg/ 2>/dev/null || true
              # hdiutil può fallire con EBUSY transitorio sui runner.
              for attempt in 1 2 3; do
                hdiutil create -volname "Noesis PDF Reader Lite Engine" \
                  -srcfolder dmg -ov -format UDZO "$BASE.dmg" && break
                sleep 5
              done
              test -f "$BASE.dmg"
              ;;
          esac
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noesis-pdf-reader-lite-engine-${{ matrix.name }}
          path: noesis-pdf-reader-lite-engine-${{ matrix.name }}*
          if-no-files-found: error

  linux-appimage:
    name: linux-x86_64-appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-tui.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-pdf-reader-lite-engine \
            --collect-all textual \
            --collect-all pymupdf --collect-all pymupdf4llm \
            cli.py \
          || pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-pdf-reader-lite-engine \
            cli.py

      - name: Package AppImage
        shell: bash
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp "dist/noesis-pdf-reader-lite-engine" "$APPDIR/usr/bin/noesis-pdf-reader-lite-engine"
          chmod +x "$APPDIR/usr/bin/noesis-pdf-reader-lite-engine"
          cp assets/noesis-pdf-reader-lite-engine.png "$APPDIR/noesis-pdf-reader-lite-engine.png"
          cat > "$APPDIR/noesis-pdf-reader-lite-engine.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Noesis PDF Reader Lite Engine
          Exec=noesis-pdf-reader-lite-engine %F
          Icon=noesis-pdf-reader-lite-engine
          Categories=Office;Utility;
          Comment=Extract and translate PDF pages from the terminal (CLI + TUI)
          Terminal=true
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/noesis-pdf-reader-lite-engine" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run \
            "$APPDIR" "noesis-pdf-reader-lite-engine-x86_64.AppImage"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noesis-pdf-reader-lite-engine-linux-x86_64-appimage
          path: noesis-pdf-reader-lite-engine-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      # Serve per RELEASE_NOTES.md (body_path).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Read release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat RELEASE_NOTES.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.notes.outputs.body }}
          # Idempotente: un re-tag può riusare la release esistente.
          overwrite_files: true
